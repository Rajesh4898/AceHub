{% extends "base.html" %}
{% block title %}Log in - AssistHub{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Log in to start or join a support session.</p>
  <form method="post" class="form">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="auth-alt">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
